<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Gobang — Demo</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #f0f6fc; }
      main { width: min(1100px, calc(100% - 32px)); padding: 32px 0; }
      h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      p { color: #8b949e; line-height: 1.5; }
      video { display: block; width: 100%; max-height: 78vh; background: #000; border: 1px solid #30363d; border-radius: 12px; }
      a { color: #58a6ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Online Gobang</h1>
      <p>Two-player synchronization walkthrough. Use the player controls to pause, replay, or view full screen.</p>
      <video controls playsinline autoplay muted loop preload="metadata" aria-label="Online Gobang demo">
        <source src="assets/visual-demos/online-gobang.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <p><a href="https://github.com/Han-chh/Online-Gobang">Back to the repository</a></p>
    </main>
  </body>
</html>
